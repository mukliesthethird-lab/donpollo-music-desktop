name: Build Mac Release

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v1.1.9)

permissions:
  contents: write # Required to upload files to GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish Mac App
        run: |
          npm run build
          npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac Installer to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer
          path: release/*.dmg
